# For 16GB 4060 Ti cards only. Uses a larger Whisper model and a slightly
# higher detection size. Still unloads models between stages.
# Full Wan2.2 / AniCrafter replacement is NOT enabled here; those remain
# optional future work even on 16GB.

device: cuda
vram_gb: 16
cpu_threads: 4
opencv_threads: 2

whisper:
  model: medium
  compute_type: float16
  device: cuda
  beam_size: 3
  vad_filter: true

detect:
  model: yolo11n.pt
  imgsz: 960
  conf: 0.35
  iou: 0.5
  tracker: bytetrack.yaml

identity:
  model: buffalo_l
  det_size: 640
  cluster_threshold: 0.45
  max_faces_per_track: 36
  sample_every: 3

# B1 跟踪优先：跨镜头轨迹拼接（三票制）。人脸票看样本集最佳配对，
# 身体票看 CLIP 外观 embedding，服装票看 HSV 直方图；≥2 票且无人脸
# 强反对才合并。身体票缺 CLIP 时弃权（人脸+服装仍可合并）。
stitch:
  face_best_min: 0.6
  face_median_min: 0.5
  face_veto: 0.3
  body_min: 0.75
  costume_min: 0.8
  min_votes: 2
  face_top_pairs: 3
  face_max_samples: 8

pose:
  backend: auto
  mode: balanced
  overlay: true
  export_smpl_hook: true
  quality: accuracy
  sample_every: 2
  smooth: true
  min_pose_iou: 0.3

replace:
  backend: inswapper
  model: inswapper_128.onnx
  model_url: https://huggingface.co/ezioruan/inswapper_128.onnx/resolve/main/inswapper_128.onnx
  detect_every: 4
  temporal_alpha: 0.62
  min_similarity: 0.55

scene:
  threshold: 27
  min_shot_sec: 0.4

compose:
  crf: 17
  use_nvenc: true
  audio: original
  burn_subs: false

matting:
  model: u2net

diarization:
  sample_rate: 16000
  min_speech_sec: 0.3
  min_silence_sec: 0.3
  merge_gap_sec: 0.5
  max_speakers: 8

costume:
  tagger: clip
  clip_model: ViT-B/32

model3d:
  backend: triposg
  triposg_repo: ""
  # TripoSG 单独 conda 环境的 python（conda create -n tripoSG python=3.10），
  # 为空则用运行 local-recast 的 python。
  triposg_python: ""
